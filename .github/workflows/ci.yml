name: Build and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release with this tag (for example v0.1.0); empty for a plain build
        required: false
        default: ''
permissions:
  contents: read
env:
  # From the release's SHA512-SUMS.txt; change all three together.
  # The same 4.5.2 the game is made in: 4.5.0's RenderingServer returns
  # surface LODs in another shape, and the graphics test failed only in CI.
  GODOT_VERSION: 4.5.2
  GODOT_SHA512: e3ce6194b6d4d2dcef5e5b5136752c084d9d8b9071c10bc2d2011b947ec7439a257c8d23c541cb30699f16d9edea6dff36e6e84d2bec14a8fe9b4e9aacbe5a8d
  TEMPLATES_SHA512: 003aa33743f58fb657717f090fc872ed3975e48d08a6012201a2259970d458a63d4d8a83090585307c23455ebfa4e6e0050e1057761c34863536095e3fcfab6c
jobs:
  gamenight-sdk:
    uses: ontola/gamenight/.github/workflows/godot-sdk-check.yml@main
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Godot and the Windows export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "$GODOT_SHA512  godot.zip" | sha512sum --check
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot" && rm godot.zip
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "$TEMPLATES_SHA512  templates.tpz" | sha512sum --check
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dir"
          unzip -q -j templates.tpz templates/version.txt templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe -d "$dir"
          rm templates.tpz
          pip install websockets
      - name: Import
        run: $RUNNER_TEMP/godot --headless --import || true
      - name: Handling bench
        run: $RUNNER_TEMP/godot --headless --fixed-fps 120 --path . --script res://tests/bench.gd
      - name: Graphics geometry regression
        # A failed assert stops the script before quit(): without a limit the
        # job hung for its whole 30 minutes.
        timeout-minutes: 2
        run: $RUNNER_TEMP/godot --headless --path . --script res://tests/graphics.gd
      - name: Photo grass mesh, materials and grid properties regression
        timeout-minutes: 2
        run: $RUNNER_TEMP/godot --headless --path . --script res://tests/photo_grass.gd
      - name: Native-resolution split-screen regression
        timeout-minutes: 2
        run: $RUNNER_TEMP/godot --headless --path . --script res://tests/view_resolution.gd
      - name: Dynamic resolution GPU controller regression
        timeout-minutes: 2
        run: $RUNNER_TEMP/godot --headless --path . --script res://tests/dynamic_resolution.gd
      - name: Live weather setting regression
        timeout-minutes: 2
        run: $RUNNER_TEMP/godot --headless --path . --script res://tests/weather_settings.gd
      - name: Player controls, road effects, solid props and loading regression
        timeout-minutes: 5
        run: |
          $RUNNER_TEMP/godot --headless --path . --script res://tests/player_controls.gd
          $RUNNER_TEMP/godot --headless --path . --script res://tests/road_visuals.gd
          $RUNNER_TEMP/godot --headless --path . --script res://tests/wheel_fx.gd
          $RUNNER_TEMP/godot --headless --path . --script res://tests/solid_props.gd
          $RUNNER_TEMP/godot --headless --path . --script res://tests/stage_loading.gd
      - name: Tyre visual cache regression
        timeout-minutes: 2
        run: $RUNNER_TEMP/godot --headless --path . --script res://tests/tyre_visuals.gd
      - name: Stage query cache regression
        timeout-minutes: 2
        run: $RUNNER_TEMP/godot --headless --path . --script res://tests/stage_queries.gd
      - name: Car surface query regression
        timeout-minutes: 2
        run: $RUNNER_TEMP/godot --headless --path . --script res://tests/car_surface_queries.gd
      - name: Stage surface descriptor regression
        timeout-minutes: 2
        run: $RUNNER_TEMP/godot --headless --path . --script res://tests/stage_surfaces.gd
      - name: Stage layout geometry, clearance and determinism regression
        timeout-minutes: 2
        run: $RUNNER_TEMP/godot --headless --path . --script res://tests/stage_layout.gd
      - name: Forest shadow material and geometry regression
        timeout-minutes: 2
        run: $RUNNER_TEMP/godot --headless --path . --script res://tests/forest_shadow_fade.gd
      - name: Per-view tree sets lifecycle and selection regression
        timeout-minutes: 2
        run: $RUNNER_TEMP/godot --headless --path . --script res://tests/tree_sets.gd
      - name: Tree tangent generator regression
        timeout-minutes: 2
        run: $RUNNER_TEMP/godot --headless --path . --script res://tests/tree_tangents.gd -- --assets
      - name: Impostor atlas registration regression
        timeout-minutes: 2
        run: $RUNNER_TEMP/godot --headless --path . --script res://tests/impostor_atlas.gd
      - name: Bots drive a whole stage
        run: $RUNNER_TEMP/godot --headless --fixed-fps 120 --path . -- --sim 50000 --seed 1 --km 2
      - name: GameNight lifecycle and controller input
        run: python tests/lifecycle.py --godot $RUNNER_TEMP/godot
      - name: Export Windows build
        run: |
          mkdir -p build/windows
          $RUNNER_TEMP/godot --headless --export-release "Windows" build/windows/Sideways.exe
          $RUNNER_TEMP/godot --headless --export-pack "Windows" build/game.pck
      - name: The exported game runs
        run: python tests/lifecycle.py --godot $RUNNER_TEMP/godot --pack build/game.pck
      - name: Package
        run: |
          cd build/windows
          zip -q -9 sideways-windows.zip Sideways*.exe
          sha256sum sideways-windows.zip > release-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sideways-windows
          path: |
            build/windows/sideways-windows.zip
            build/windows/release-sha256.txt
          if-no-files-found: error
  release:
    needs: build
    # Tag pushes may be blocked for agents; a manual run that names the tag works everywhere.
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.release, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # A publish key from the GameNight portal; without it the store step is skipped.
      GAMENIGHT_API_TOKEN: ${{ secrets.GAMENIGHT_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sideways-windows
          path: release
      - name: Publish the tested build and the store media
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
        run: |
          cd release
          sha256sum --check release-sha256.txt
          media=$(ls ../assets/gamenight/*.{mp4,jpg,png} 2>/dev/null || true)
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" sideways-windows.zip release-sha256.txt $media --repo "$GITHUB_REPOSITORY" --title "Sideways $RELEASE_TAG" --generate-notes
      # Fills the store page from gamenight.json and assets/gamenight.
      - uses: actions/checkout@v4
        if: env.GAMENIGHT_API_TOKEN != ''
        with:
          repository: ontola/gamenight
          path: .gamenight
          sparse-checkout: scripts/gamenight-publish.py
          sparse-checkout-cone-mode: false
      - name: Update the GameNight store page
        if: env.GAMENIGHT_API_TOKEN != ''
        run: python3 .gamenight/scripts/gamenight-publish.py store
