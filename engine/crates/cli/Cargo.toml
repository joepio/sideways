[package]
name = "cli"
edition.workspace = true
version.workspace = true

[[bin]]
name = "sideways"
path = "src/main.rs"

[dependencies]
sideways.workspace = true
kern.workspace = true
gdcompat.workspace = true
serde_json.workspace = true
render = { path = "../render" }
toml.workspace = true
glam = "0.31"
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "KHR_texture_transform", "allow_empty_texture", "extensions"] }
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg"] }
